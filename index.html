<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121316" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pan Assets" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Apply theme before paint (stored choice, else system) -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('panassets-theme'); } catch (e) {}
        if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.classList.add(t);
        var meta = document.getElementById('theme-color-meta');
        if (meta) meta.content = t === 'dark' ? '#121316' : '#f2f3f6';
      })();
    </script>
    <title>Pan Assets</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
